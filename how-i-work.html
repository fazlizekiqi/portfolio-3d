<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How I Work</title>

<!--
  HOW TO SWAP PLACEHOLDERS FOR REAL IMAGES
  ─────────────────────────────────────────
  Each card's <image> tag is inside the SVG group with id="card-img-N" (N = 0–3).
  Replace the <rect class="img-placeholder"> and its <text> sibling with:

    <image href="your-image.png" x="0" y="0" width="160" height="100"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip-N)" />

  Add a matching clipPath in <defs>:
    <clipPath id="card-clip-N">
      <rect rx="6" width="160" height="100" />
    </clipPath>
-->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080d24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }

  .section-title {
    color: #8bc8f0;
    font-size: clamp(13px, 1.5vw, 16px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  h2 {
    color: #e8f4ff;
    font-size: clamp(22px, 3.5vw, 38px);
    font-weight: 700;
    margin-bottom: 40px;
    letter-spacing: -0.01em;
  }

  h2 span {
    background: linear-gradient(90deg, #00d4ff, #0a8fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .arch-wrapper {
    width: min(960px, 96vw);
    position: relative;
  }

  /* ── Arch SVG ── */
  #arch-svg {
    width: 100%;
    overflow: visible;
  }

  /* Arch path */
  .arch-path {
    fill: none;
    stroke: #1a4a7a;
    stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(10,143,255,0.3));
  }

  /* Node circles */
  .node-ring {
    fill: #080d24;
    stroke: #0a8fff;
    stroke-width: 2;
    transition: r 0.3s ease-in-out;
  }
  .node-inner {
    fill: #00d4ff;
  }

  /* Connector lines */
  .connector {
    stroke: #1e3a5f;
    stroke-width: 1.5;
    stroke-dasharray: 4 4;
  }

  /* Card backgrounds */
  .card-bg {
    fill: rgba(10, 20, 50, 0.88);
    rx: 10;
    stroke: #1a4a7a;
    stroke-width: 1;
  }

  /* Image placeholder */
  .img-placeholder {
    fill: #0d1e35;
    rx: 6;
  }

  .img-label {
    fill: #2a5a8a;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  .card-title {
    fill: #e8f4ff;
    font-size: 13px;
    font-weight: 600;
    font-family: system-ui, sans-serif;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  .card-caption {
    fill: #8bc8f0;
    font-size: 10px;
    letter-spacing: 0.08em;
    font-family: ui-monospace, Consolas, monospace;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  /* Glowing travel dot */
  #travel-dot {
    fill: #00d4ff;
    filter: drop-shadow(0 0 5px #00d4ff) drop-shadow(0 0 10px #0a8fff);
  }

  /* Card hover lift — driven by JS via transform */
  .card-group {
    transition: transform 0.35s ease-in-out, filter 0.35s ease-in-out;
  }
  .card-group.active {
    filter: drop-shadow(0 8px 18px rgba(0,212,255,0.35));
  }
</style>
</head>
<body>

<p class="section-title">Process</p>
<h2>How I <span>Work</span></h2>

<div class="arch-wrapper">
  <svg id="arch-svg" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- reusable card clip paths (swap placeholder → real image) -->
      <clipPath id="card-clip-0"><rect rx="6" width="160" height="100"/></clipPath>
      <clipPath id="card-clip-1"><rect rx="6" width="160" height="100"/></clipPath>
      <clipPath id="card-clip-2"><rect rx="6" width="160" height="100"/></clipPath>
      <clipPath id="card-clip-3"><rect rx="6" width="160" height="100"/></clipPath>
    </defs>

    <!-- ── Segmental arch ── -->
    <!-- Arc: center (480, 530), radius 460, spans from x≈115 to x≈845 at y≈80–200 -->
    <path id="arch-path" class="arch-path"
          d="M 115 270 A 460 460 0 0 1 845 270" />

    <!-- ── Travel dot (positioned by JS) ── -->
    <circle id="travel-dot" r="5.5" cx="0" cy="0" />

    <!-- ── Cards injected by JS ── -->
    <g id="cards-root"></g>
  </svg>
</div>

<script>
// ─── Data ────────────────────────────────────────────────────────────────────
const CARDS = [
  { title: 'Design',      caption: 'Scalability & Reliability',     label: '[ design ]'      },
  { title: 'Clean',       caption: 'Maintainable Architecture',     label: '[ clean ]'        },
  { title: 'Observe',     caption: 'Observability & Monitoring',    label: '[ observe ]'      },
  { title: 'Collaborate', caption: 'Teams & Stakeholders',          label: '[ collaborate ]'  },
];

// ─── Arch path reference ──────────────────────────────────────────────────────
const archPath   = document.getElementById('arch-path');
const totalLen   = archPath.getTotalLength();

// Node t-positions along the arch (0 = start, 1 = end)
const NODE_T = [0.14, 0.36, 0.64, 0.86];

// ─── Build node & card elements ───────────────────────────────────────────────
const svgNS    = 'http://www.w3.org/2000/svg';
const cardsRoot = document.getElementById('cards-root');

const nodeRings  = [];
const nodeInners = [];
const cardGroups = [];
const connectors = [];

const CARD_W = 160, CARD_H = 156; // card total height (img + title + caption)
const IMG_H  = 100;
const CONN_LEN = 44;

NODE_T.forEach((t, i) => {
  const pt = archPath.getPointAtLength(t * totalLen);

  // ── Connector line ──
  const conn = document.createElementNS(svgNS, 'line');
  conn.setAttribute('class', 'connector');
  conn.setAttribute('x1', pt.x);
  conn.setAttribute('y1', pt.y + 8);
  conn.setAttribute('x2', pt.x);
  conn.setAttribute('y2', pt.y + 8 + CONN_LEN);
  cardsRoot.appendChild(conn);
  connectors.push(conn);

  // ── Card group ──
  const cardY = pt.y + 8 + CONN_LEN;
  const cardX = pt.x - CARD_W / 2;
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'card-group');
  g.setAttribute('id', `card-group-${i}`);
  g.setAttribute('transform', `translate(${cardX}, ${cardY})`);

  // card background
  const bg = document.createElementNS(svgNS, 'rect');
  bg.setAttribute('class', 'card-bg');
  bg.setAttribute('width', CARD_W);
  bg.setAttribute('height', CARD_H);
  bg.setAttribute('rx', 10);
  bg.setAttribute('stroke', '#1a4a7a');
  bg.setAttribute('stroke-width', 1);
  bg.setAttribute('fill', 'rgba(10,20,50,0.88)');
  g.appendChild(bg);

  // image placeholder
  const imgRect = document.createElementNS(svgNS, 'rect');
  imgRect.setAttribute('class', 'img-placeholder');
  imgRect.setAttribute('x', 8);
  imgRect.setAttribute('y', 8);
  imgRect.setAttribute('width', CARD_W - 16);
  imgRect.setAttribute('height', IMG_H);
  imgRect.setAttribute('rx', 6);
  g.appendChild(imgRect);

  const imgLabel = document.createElementNS(svgNS, 'text');
  imgLabel.setAttribute('class', 'img-label');
  imgLabel.setAttribute('x', CARD_W / 2);
  imgLabel.setAttribute('y', 8 + IMG_H / 2);
  imgLabel.textContent = CARDS[i].label;
  g.appendChild(imgLabel);

  // title
  const titleEl = document.createElementNS(svgNS, 'text');
  titleEl.setAttribute('class', 'card-title');
  titleEl.setAttribute('x', CARD_W / 2);
  titleEl.setAttribute('y', 8 + IMG_H + 18);
  titleEl.textContent = CARDS[i].title;
  g.appendChild(titleEl);

  // caption
  const capEl = document.createElementNS(svgNS, 'text');
  capEl.setAttribute('class', 'card-caption');
  capEl.setAttribute('x', CARD_W / 2);
  capEl.setAttribute('y', 8 + IMG_H + 36);
  capEl.textContent = CARDS[i].caption;
  g.appendChild(capEl);

  cardsRoot.appendChild(g);
  cardGroups.push(g);

  // ── Node (drawn on top) ──
  const ring = document.createElementNS(svgNS, 'circle');
  ring.setAttribute('class', 'node-ring');
  ring.setAttribute('cx', pt.x);
  ring.setAttribute('cy', pt.y);
  ring.setAttribute('r', 8);
  cardsRoot.appendChild(ring);
  nodeRings.push(ring);

  const inner = document.createElementNS(svgNS, 'circle');
  inner.setAttribute('class', 'node-inner');
  inner.setAttribute('cx', pt.x);
  inner.setAttribute('cy', pt.y);
  inner.setAttribute('r', 3.5);
  cardsRoot.appendChild(inner);
  nodeInners.push(inner);
});

// Move travel dot on top
const dot = document.getElementById('travel-dot');
cardsRoot.appendChild(dot);

// ─── Animation state ──────────────────────────────────────────────────────────
const TRAVEL_MS  = 3000;   // total travel time excluding pauses
const PAUSE_MS   = 450;    // pause duration at each node
const PULSE_MS   = 320;    // node pulse duration

// Precompute node lengths
const nodeLengths = NODE_T.map(t => t * totalLen);
const startLen    = nodeLengths[0];
const endLen      = nodeLengths[NODE_T.length - 1];
const travelSpan  = endLen - startLen;

let startTime  = null;
let pauseUntil = 0;
let currentLen = startLen;
let activeNode = -1;
const pulsing  = new Set();

function setDotPosition(len) {
  const pt = archPath.getPointAtLength(len);
  dot.setAttribute('cx', pt.x);
  dot.setAttribute('cy', pt.y);
}

function triggerNodePulse(i) {
  if (pulsing.has(i)) return;
  pulsing.add(i);

  // Lift card
  const g = cardGroups[i];
  g.classList.add('active');
  const cardX  = parseFloat(g.getAttribute('transform').match(/translate\(([^,]+)/)[1]);
  const cardY0 = parseFloat(g.getAttribute('transform').match(/,([^)]+)/)[1]);
  g.setAttribute('transform', `translate(${cardX}, ${cardY0 - 6})`);

  // Pulse ring: grow then shrink
  const ring = nodeRings[i];
  let t0 = null;
  function animRing(ts) {
    if (!t0) t0 = ts;
    const p = Math.min((ts - t0) / PULSE_MS, 1);
    // ease-in-out triangle: 0→1 at p=0.5, 1→0 at p=1
    const scale = p < 0.5 ? p * 2 : (1 - p) * 2;
    ring.setAttribute('r', 8 + scale * 5);
    if (p < 1) requestAnimationFrame(animRing);
    else {
      ring.setAttribute('r', 8);
      pulsing.delete(i);
    }
  }
  requestAnimationFrame(animRing);

  // Reset card after pause
  setTimeout(() => {
    g.classList.remove('active');
    g.setAttribute('transform', `translate(${cardX}, ${cardY0})`);
  }, PAUSE_MS + 80);
}

function resetAll() {
  nodeRings.forEach(r => r.setAttribute('r', 8));
  cardGroups.forEach((g, i) => {
    const m   = g.getAttribute('transform').match(/translate\(([^,]+),([^)]+)\)/);
    const cx  = parseFloat(m[1]);
    // recalculate original Y from node position
    const pt  = archPath.getPointAtLength(NODE_T[i] * totalLen);
    const origY = pt.y + 8 + CONN_LEN;
    g.setAttribute('transform', `translate(${cx}, ${origY})`);
    g.classList.remove('active');
  });
  pulsing.clear();
  activeNode = -1;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function tick(ts) {
  requestAnimationFrame(tick);

  if (!startTime) { startTime = ts; setDotPosition(startLen); return; }

  // Wait out any pause
  if (ts < pauseUntil) return;

  const elapsed = ts - startTime;
  const progress = Math.min(elapsed / TRAVEL_MS, 1);

  // ease-in-out cubic
  const ease = progress < 0.5
    ? 4 * progress ** 3
    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

  currentLen = startLen + ease * travelSpan;
  setDotPosition(currentLen);

  // Check proximity to each node
  for (let i = 0; i < nodeLengths.length; i++) {
    if (activeNode !== i && Math.abs(currentLen - nodeLengths[i]) < 4) {
      activeNode = i;
      triggerNodePulse(i);
      pauseUntil = ts + PAUSE_MS;
      // Freeze time reference so travel resumes smoothly
      startTime = ts + PAUSE_MS - elapsed;
      return;
    }
  }

  // Restart when done
  if (progress >= 1) {
    startTime = null;
    pauseUntil = ts + 600;
    resetAll();
  }
}

requestAnimationFrame(tick);
</script>
</body>
</html>
